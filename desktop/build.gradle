plugins {
    id("application")
    id("java")
}

dependencies {
    implementation(project(":core"))
    implementation("com.badlogicgames.gdx:gdx-backend-lwjgl3:${rootProject.ext.gdxVersion}")
    runtimeOnly("com.badlogicgames.gdx:gdx-platform:${rootProject.ext.gdxVersion}:natives-desktop")

    // ANGLE/GLES/EGL support for Windows when using GLES emulation
    // LWJGL version is pulled transitively by gdx-backend-lwjgl3 (currently 3.3.3),
    // we add matching modules explicitly to enable EGL + OpenGLES + ANGLE.
    implementation("org.lwjgl:lwjgl-egl:3.3.3")
    implementation("org.lwjgl:lwjgl-opengles:3.3.3")
    runtimeOnly("org.lwjgl:lwjgl-opengles:3.3.3:natives-windows")
}

application {
    mainClass = "com.muisca.desktop.DesktopLauncher"
}

tasks.named("run", JavaExec).configure {
    workingDir = rootProject.file("assets")
    standardInput = System.in
    // Java 25 runtime support: enable native access to avoid future blocking of restricted methods
    // See JDK 25 warnings in LWJGL about restricted methods becoming blocked without native access.
    // This flag is harmless on 25 and prepares us for future releases.
    jvmArgs("--enable-native-access=ALL-UNNAMED")
    String autoQuit = System.getProperty("muisca.autoQuitSeconds")
    if (autoQuit != null && !autoQuit.isBlank()) {
        systemProperty("muisca.autoQuitSeconds", autoQuit)
    }
    // Propagate any custom Muisca system properties passed to Gradle (e.g. -Dmuisca.angle=true)
    // into the application process so DesktopLauncher/MuiscaGame can consume them.
    System.properties.each { k, v ->
        def key = k?.toString()
        if (key != null && key.startsWith("muisca.")) {
            def value = v?.toString()
            if (value != null) {
                systemProperty(key, value)
            }
        }
    }
}
