plugins {
    id("base")
}

ext {
    gdxVersion = "1.12.1"
    ashleyVersion = "1.7.3"
    aiVersion = "1.8.2"
}

allprojects {
    group = "com.muisca"
    version = "0.0.6"

    repositories {
        mavenCentral()
    }
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                // Usamos JDK 21 para mayor compatibilidad con LWJGL 3.3.x en runtime
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        // Compilamos apuntando a release 21 para asegurar que el código corra bien con un runtime 21
        options.release = 21
    }

    tasks.withType(JavaExec).configureEach {
        // Ejecutamos las apps (desktop:run) con JDK 21
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

tasks.register("printJavaVersion") {
    group = "verification"
    description = "Prints the Java runtime used by Gradle."
    doLast {
        println "Gradle running on Java: ${System.getProperty('java.version')} (${System.getProperty('java.vendor')})"
    }
}
